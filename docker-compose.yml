services:
  retail-postgres:
    image: postgis/postgis:16-3.4
    container_name: retail-postgres
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password
      POSTGRES_DB: retail_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail_network

  retail-redis:
    image: redis:7.4-alpine
    container_name: retail-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail_network

  retail-minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: retail-minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail_network

  spark-master:
    image: apache/spark:3.4.1
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/spark/src
    networks:
      - retail_network

  spark-worker:
    image: apache/spark:3.4.1
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/spark/src
    networks:
      - retail_network

  airflow-webserver:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow-webserver
    command: bash -c "airflow db init && airflow users create --username admin --password admin123 --firstname Admin --lastname User --role Admin --email admin@airflow.local 2>/dev/null || true && airflow webserver"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://retail_user:retail_password@retail-postgres:5432/retail_dw
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://retail_user:retail_password@retail-postgres:5432/retail_dw
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__LOGGING_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      retail-postgres:
        condition: service_healthy
      retail-redis:
        condition: service_healthy
    networks:
      - retail_network

  airflow-scheduler:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://retail_user:retail_password@retail-postgres:5432/retail_dw
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://retail_user:retail_password@retail-postgres:5432/retail_dw
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__LOGGING_LEVEL: INFO
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      retail-postgres:
        condition: service_healthy
      retail-redis:
        condition: service_healthy
    networks:
      - retail_network

  adminer:
    image: adminer:latest
    container_name: retail-adminer
    depends_on:
      - retail-postgres
    ports:
      - "8082:8080"
    networks:
      - retail_network

volumes:
  postgres_data:
  minio_data:

networks:
  retail_network:
    driver: bridge
